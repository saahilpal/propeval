[project]
name = "propeval"
version = "0.1.0"
description = "Hinglish Real-Estate Voice Agent Evaluation & Prompt Regression Workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.4",
    "numpy>=2.1.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "openai>=1.57.0",
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.120.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
propeval = "backend.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["B008", "E501"]

[tool.pyright]
include = ["backend/app"]
exclude = ["backend/tests", "**/node_modules", "**/__pycache__"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
